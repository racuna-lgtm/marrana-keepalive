name: 🐷 Marrana Keepalive

on:
  # Ejecutar automáticamente TODOS LOS DÍAS a las 10:00 UTC (07:00 hora Chile)
  schedule:
    - cron: '0 10 * * *'

  # Permitir ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

# Necesario para que el paso de mini-commit pueda hacer push
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    name: Pinguear proyectos Supabase

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏓 Pinguear proyectos
        run: node ping.js

      # Mini-commit diario: mantiene el repo "activo" para que GitHub
      # NO desactive el workflow programado tras 60 días de inactividad.
      - name: 🕒 Mini-commit para mantener vivo el workflow
        if: always()
        run: |
          echo "Último keepalive: $(date -u)" > last-run.txt
          git config user.name "marrana-keepalive-bot"
          git config user.email "actions@github.com"
          git add last-run.txt
          git commit -m "keepalive: $(date -u +%Y-%m-%d)" || echo "Sin cambios que commitear"
          git push

      - name: 📊 Resumen final
        if: always()
        run: |
          echo "## 🐷 Marrana Keepalive ejecutado"
          echo "Fecha: $(date)"
          echo "Estado: ${{ job.status }}"
